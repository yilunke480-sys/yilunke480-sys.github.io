<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal homepage of Daniel Nurmemet, an undergraduate at Xi’an Jiaotong-Liverpool University.">
  <meta name="color-scheme" content="light">
  <title>Daniel Nurmemet · Personal Homepage</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #252b27;
      background: #f8f8f3;
      font-synthesis: none;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(42rem, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: clamp(4rem, 16vh, 9rem) 4rem;
    }
    main::before {
      display: block;
      width: 2.5rem;
      height: 3px;
      background: #356450;
      margin-bottom: 1.5rem;
      content: "";
    }
    h1 {
      margin: 0 0 0.8rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.06;
      overflow-wrap: anywhere;
    }
    .intro {
      color: #48534c;
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.65;
    }
    dl {
      margin: 2rem 0 0;
      padding-top: 1.3rem;
      border-top: 1px solid #cdd6cb;
      display: grid;
      grid-template-columns: minmax(5rem, max-content) minmax(0, 1fr);
      gap: 0.75rem 1rem;
      line-height: 1.45;
    }
    dt { font-weight: 600; }
    dd { margin: 0; overflow-wrap: anywhere; }
    a { color: #245b45; text-underline-offset: 0.19em; }
    a:hover { color: #183c2e; }
    a:focus-visible { outline: 2px solid #245b45; outline-offset: 4px; }
    @media (max-width: 23rem) {
      dl { grid-template-columns: minmax(0, 1fr); row-gap: 0.4rem; }
      dd + dt { margin-top: 0.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Daniel Nurmemet</h1>
    <p class="intro">Undergraduate at Xi’an Jiaotong-Liverpool University</p>
    <dl aria-label="Contact and links">
      <dt>Email</dt>
      <dd><a href="mailto:N.Dannier25@student.xjtlu.edu.cn">N.Dannier25@student.xjtlu.edu.cn</a></dd>
      <dt>GitHub</dt>
      <dd><a href="https://github.com/yilunke480-sys">yilunke480-sys</a></dd>
    </dl>
  </main>
</body>
</html>
